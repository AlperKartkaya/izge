# Built locally, then managed by Coolify. No external registry or domain required.
services:
  backend:
    image: izge-backend:local
    pull_policy: never
    restart: unless-stopped
    environment:
      IZGE_SQLITE_PATH: /data/izge.db
      IZGE_STORAGE_ROOT: /data/storage
      IZGE_PASTED_TEXT_ROOT: /data/pasted
      IZGE_BOOTSTRAP_ADMIN_CREDENTIALS_PATH: /data/bootstrap_admin_credentials.json
      IZGE_DEFAULT_ADMIN_EMAIL: admin@example.com
      IZGE_SYNC_DEFAULT_ADMIN_PASSWORD: "false"
      IZGE_DEMO_SEED_ENABLED: "false"
      IZGE_LOCAL_LLM_ENABLED: "true"
      IZGE_LOCAL_LLM_BASE_URL: http://host.docker.internal:11434
      IZGE_LOCAL_LLM_MODEL: qwen3.5:9b
      IZGE_LOCAL_LLM_TIMEOUT_SECONDS: "120"
      IZGE_LLM_QUERY_ROUTING_ENABLED: "true"
      IZGE_LLM_ANSWER_SYNTHESIS_ENABLED: "true"
    volumes:
      - izge-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  colleague:
    image: izge-backend:local
    pull_policy: never
    restart: unless-stopped
    command: [python, -m, app.colleague_worker, --worker-id, local-colleague]
    environment:
      IZGE_SQLITE_PATH: /data/izge.db
      IZGE_STORAGE_ROOT: /data/storage
      IZGE_PASTED_TEXT_ROOT: /data/pasted
      IZGE_BOOTSTRAP_ADMIN_CREDENTIALS_PATH: /data/bootstrap_admin_credentials.json
      IZGE_LOCAL_LLM_ENABLED: "true"
      IZGE_LOCAL_LLM_BASE_URL: http://host.docker.internal:11434
      IZGE_LOCAL_LLM_MODEL: qwen3.5:9b
      IZGE_LOCAL_LLM_TIMEOUT_SECONDS: "120"
    volumes:
      - izge-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
  frontend:
    image: izge-frontend:local
    pull_policy: never
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 5
  website:
    image: izge-website:local
    pull_policy: never
    restart: unless-stopped
    ports:
      - 127.0.0.1:8081:80
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  izge-data:
    external: true
    name: izge-product-data
