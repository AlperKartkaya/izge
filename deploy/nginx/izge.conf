# Izge MVP deployment nginx site.
# Copy to: /etc/nginx/sites-available/izge.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/izge.conf /etc/nginx/sites-enabled/izge.conf
# After DNS is live, use certbot to replace the temporary HTTP-only posture with TLS certificates.

server {
    listen 80;
    listen [::]:80;
    server_name izge.dev www.izge.dev;

    root /var/www/izge/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "izge.dev ok\n";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.izge.dev;

    root /var/www/izge/app;
    index index.html;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
