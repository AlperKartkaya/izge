# Local-only Coolify management. Docker Desktop supplies the Linux host.
services:
  coolify-testing-host:
    image: izge-coolify-testing-host:local
    container_name: izge-coolify-host
    init: true
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${IZGE_COOLIFY_ROOT}:/data/coolify
      - ${IZGE_COOLIFY_ROOT}/host_authorized_keys:/root/.ssh/authorized_keys:ro
  coolify:
    image: coollabsio/coolify@sha256:35a696ef3b37c01b2e005fbae57fd70a79fa7d3cd29d8593a78383fac3b257f5
    container_name: izge-coolify
    restart: unless-stopped
    env_file: ${IZGE_COOLIFY_ROOT}/.env
    environment:
      APP_ENV: production
      SSL_MODE: off
      SELF_HOSTED: "true"
      AUTOUPDATE: "false"
      SSH_MUX_ENABLED: "false"
      IS_WINDOWS_DOCKER_DESKTOP: "true"
    ports:
      - 127.0.0.1:8000:8080
      - 127.0.0.1:6001:6001
      - 127.0.0.1:6002:6002
    volumes:
      - ${IZGE_COOLIFY_ROOT}/.env:/var/www/html/.env:ro
      - ${IZGE_COOLIFY_ROOT}/ssh:/var/www/html/storage/app/ssh
      - ${IZGE_COOLIFY_ROOT}/applications:/var/www/html/storage/app/applications
      - ${IZGE_COOLIFY_ROOT}/databases:/var/www/html/storage/app/databases
      - ${IZGE_COOLIFY_ROOT}/services:/var/www/html/storage/app/services
      - ${IZGE_COOLIFY_ROOT}/backups:/var/www/html/storage/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: ${IZGE_COOLIFY_ROOT}/.env
    environment:
      POSTGRES_USER: coolify
      POSTGRES_DB: coolify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - coolify-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coolify -d coolify]
      interval: 5s
      timeout: 2s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [sh, -c, 'exec redis-server --save 20 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"']
    env_file: ${IZGE_COOLIFY_ROOT}/.env
    volumes:
      - coolify-redis:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 2s
      retries: 10
volumes:
  coolify-db:
  coolify-redis:
