x-izge-backend-common: &izge-backend-common
  build:
    context: ./backend
  environment:
    IZGE_SQLITE_PATH: /data/izge.db
    IZGE_STORAGE_ROOT: /data/storage
    IZGE_PASTED_TEXT_ROOT: /data/pasted
    IZGE_BOOTSTRAP_ADMIN_CREDENTIALS_PATH: /data/bootstrap_admin_credentials.json
    IZGE_DEFAULT_ADMIN_EMAIL: admin@example.com
    IZGE_DEFAULT_ADMIN_PASSWORD: "${IZGE_DEFAULT_ADMIN_PASSWORD:-}"
    IZGE_SYNC_DEFAULT_ADMIN_PASSWORD: "false"
    IZGE_DEMO_SEED_ENABLED: "false"
    IZGE_LOCAL_LLM_ENABLED: "${IZGE_LOCAL_LLM_ENABLED:-true}"
    IZGE_LOCAL_LLM_BASE_URL: "${IZGE_LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}"
    IZGE_LOCAL_LLM_MODEL: "${IZGE_LOCAL_LLM_MODEL:-qwen3.5:9b}"
    IZGE_LOCAL_LLM_TIMEOUT_SECONDS: "${IZGE_LOCAL_LLM_TIMEOUT_SECONDS:-60}"
    IZGE_LLM_QUERY_ROUTING_ENABLED: "${IZGE_LLM_QUERY_ROUTING_ENABLED:-true}"
    IZGE_LLM_ANSWER_SYNTHESIS_ENABLED: "${IZGE_LLM_ANSWER_SYNTHESIS_ENABLED:-true}"
    IZGE_LLM_SIGNAL_EXPLANATION_ENABLED: "${IZGE_LLM_SIGNAL_EXPLANATION_ENABLED:-true}"
  volumes:
    - ./backend/data:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  backend:
    <<: *izge-backend-common
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *izge-backend-common
    command: ["python", "-m", "app.colleague_worker", "--worker-id", "docker-colleague"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  website:
    build:
      context: .
      dockerfile: deploy/website.Dockerfile
    ports:
      - "127.0.0.1:8081:80"
